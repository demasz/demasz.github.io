name: Testes automatizados

on:
  pull_request:
    type: [opened, synchronize, reopened]

jobs: 
  test:
    name: jest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci #npm install nao respeita o package-lock.json (aplica uma nova versão), npm ci respeita

      - name: Rodar testes
        run: npx jest --ci